<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People &amp; access · Person first</title>
<link rel="stylesheet" href="../../assets/suite.css">
<link rel="stylesheet" href="../../assets/pl.css">
<link rel="stylesheet" href="perm.css">
<style>
  .pp-search { border: none; border-radius: 9px; padding: 7px 12px; background: var(--bg-sunk); min-width: 240px; outline: none; }
  .pp-card { margin-bottom: 12px; overflow: hidden; }
  .pp-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 22px 2px 10px; font: 600 13px var(--display); }
  .pp-group .muted { font-weight: 400; font-size: 12.5px; }
  .pp-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; border: none; background: none; text-align: left; }
  button.pp-head:hover { background: rgba(127, 127, 127, 0.05); }
  .pp-fte .pp-head .pav + .pav { margin-left: -18px; box-shadow: 0 0 0 2px var(--bg-elev); }
  .pp-who { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 1px; }
  .pp-who b { font-weight: 600; font-size: 14.5px; }
  .pp-login { font: 12px var(--mono); font-weight: 400; }
  .pp-sum { font-size: 12.5px; color: var(--text-2); }
  .pp-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pp-lists { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .pp-x { width: 26px; height: 26px; }
  .pp-line { font-size: 12.5px; color: var(--text-2); gap: 5px; }
  .pp-line .pi { width: 12px; height: 12px; color: var(--text-3); }
  .pp-access { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; }
  .pp-access-h { font-size: 10.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .full-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px 1px 6px; border-radius: 6px; background: var(--pass-soft); color: var(--pass); box-shadow: inset 0 0 0 1px var(--pass); }
  .full-tag .pi { width: 12px; height: 12px; }
  .pp-co { margin: 0 0 12px; }
  .pp-co-head { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: none; padding: 6px 8px; border-radius: 8px; text-align: left; font-size: 13.5px; }
  .pp-co-head:hover { background: var(--hair); }
  .pp-co-head .pi { width: 14px; height: 14px; color: var(--text-3); }
  .pp-co-avs { display: inline-flex; margin-left: auto; }
  .pp-co-avs .pav { width: 22px; height: 22px; font-size: 9.5px; box-shadow: 0 0 0 2px var(--bg); }
  .pp-co-avs .pav + .pav { margin-left: -6px; }
  .pp-co-body { padding-left: 26px; border-left: 2px solid var(--hair-2); margin-left: 16px; }
  .pp-none { font-size: 12.5px; margin: 4px 0 8px; }
  .pp-flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pp-body { padding: 0 18px 14px 56px; }
  .pp-proj { border: 1px solid var(--hair); border-radius: 12px; margin-bottom: 10px; }
  .pp-proj-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }
  .pp-proj-head .grow { flex: 1; }
  .pp-tree { list-style: none; margin: 0; padding: 4px 12px 10px; border-top: 1px solid var(--hair); }
  .pp-tree li { padding: 4px 0; }
  .pp-tree li + li { border-top: 1px dashed var(--hair); }
  .pp-tree .tn .grow { flex: 1; }
  .pp-tree .repo { max-width: 46%; }
  .pp-state { min-width: 98px; text-align: right; }
  .pp-box { width: 16px; height: 16px; margin: 0; flex: none; accent-color: var(--accent); }
  .pp-box.na { display: inline-grid; place-items: center; color: var(--text-3); }
  .pp-addproj, .pp-rm { font-size: 12.5px; }
  @media (max-width: 760px) { .pp-body { padding-left: 14px; } .pp-tree .repo { display: none; } }
</style>
</head>
<body>
<script src="perm.js"></script>
<script src="people.js"></script>
</body>
</html>
