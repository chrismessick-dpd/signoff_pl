<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signoff PL demo designs</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 32px; background: #f5f5f7; color: #1d1d1f; }
  pre { background: #fff; padding: 16px; border-radius: 10px; max-height: 60vh; overflow: auto; font-size: 12px; }
  .err { color: #d70015; font-weight: 600; }
</style>
</head>
<body>
<!--
  Builds assets/demo-designs.js: the summaries of Signoff EE's and ME's demo projects, so PL's
  demo shows the same designs, numbers and issues a visitor sees when they click through.

  Serve the tools folder (python -m http.server, from C:\Dovetail\tools), open
  http://localhost:8000/signoff_pl/tools/demo_designs.html, click Download, and save the file
  over signoff_pl/assets/demo-designs.js. Do this whenever EE's or ME's demo changes.

  Each tool is built in its own frame (?tool=ee / ?tool=me) with that tool's own config,
  checklists and engine, exactly as its demo mode builds them.
-->
<div id="status">Building…</div>
<p><button id="dl" disabled>Download demo-designs.js</button></p>
<pre id="out"></pre>
<script>
(function () {
  var TOOLS = { ee: '../../ee_design_review/', me: '../../me_design_review/' };
  var tool = (/[?&]tool=(\w+)/.exec(location.search) || [])[1];

  if (tool) {
    // Child frame: load that tool's engine, build its demo, report the summaries.
    ['config', 'templates', 'model', 'demo'].forEach(function (n) { document.write('<script src="' + TOOLS[tool] + 'assets/' + n + '.js?t=' + Date.now() + '"><\/script>'); });
    window.addEventListener('load', function () {
      var S = window.Signoff, M = S.model;
      var T = M.resolveTemplates(window.SIGNOFF_TEMPLATES || [], []);
      var out = {};
      S.demo.projects(T).forEach(function (p) {
        out[tool + ':' + p.id] = { name: p.meta.name, number: p.meta.board || '', revision: p.meta.revision || '', stage: p.meta.stage || '',
          archived: !!p.meta.archived, summary: M.projectSummary(p, T) };
      });
      parent.postMessage({ tool: tool, designs: out }, '*');
    });
    return;
  }

  // Parent: one frame per tool, then assemble the file.
  var got = {}, designs = {};
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.tool) return;
    got[e.data.tool] = 1;
    Object.keys(e.data.designs).sort().forEach(function (k) { designs[k] = e.data.designs[k]; });
    if (Object.keys(got).length < Object.keys(TOOLS).length) return;
    var data = { generatedAt: new Date().toISOString(), designs: designs };
    var text = '/* Generated by tools/demo_designs.html from the Signoff EE and ME demos. Do not edit by hand:\n' +
      '   regenerate it when their demos change. Signoff PL\'s demo links its Parts to these designs. */\n' +
      'window.SIGNOFF_PL_DEMO_DESIGNS = ' + JSON.stringify(data, null, 1) + ';\n';
    window.result = text;
    document.getElementById('status').textContent = Object.keys(designs).length + ' designs: ' + Object.keys(designs).join(', ');
    document.getElementById('out').textContent = text;
    var dl = document.getElementById('dl');
    dl.disabled = false;
    dl.onclick = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
      a.download = 'demo-designs.js'; a.click();
    };
  });
  Object.keys(TOOLS).forEach(function (t) {
    var f = document.createElement('iframe');
    f.style.display = 'none'; f.src = location.pathname + '?tool=' + t;
    document.body.appendChild(f);
  });
  setTimeout(function () { if (!window.result) document.getElementById('status').innerHTML = '<span class="err">Couldn’t build every tool’s demo. Serve the whole tools folder so ../../ee_design_review and ../../me_design_review load.</span>'; }, 8000);
})();
</script>
</body>
</html>
