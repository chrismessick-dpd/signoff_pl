<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signoff PL tests</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 32px; background: #f5f5f7; color: #1d1d1f; }
  .pass { color: #248a3d; } .fail { color: #d70015; font-weight: 600; }
  #summary { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  pre { margin: 2px 0 8px 18px; color: #515154; }
</style>
</head>
<body>
<div id="summary">Running…</div>
<div id="out"></div>
<script>
// Load fresh on every run, so a browser cache never tests old code.
['config', 'vendor/model', 'vendor/github', 'pl', 'plreqs', 'model3d', 'reader', 'demo-designs', 'demo'].forEach(function (n) { document.write('<script src="../assets/' + n + '.js?t=' + Date.now() + '"><\/script>'); });
document.write('<script src="fake-hub.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
/* Unit tests for the PL model and the summary reader, against a fake GitHub API.
   Open this file over http; the title shows PASS or FAIL. */
(async function () {
  var M = Signoff.model, P = Signoff.pl, results = [];
  function ok(cond, name, detail) { results.push({ ok: !!cond, name: name, detail: detail }); }
  function eq(a, b, name) { ok(JSON.stringify(a) === JSON.stringify(b), name, 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); }
  function at(s) { return '2099-01-01T' + s + 'Z'; }   // later than any node's creation stamp
  function node(p, f) { var n = P.newNode(p, f, 'ann'); p.nodes[n.id] = n; return n; }

  // ── Documents and merge ──
  var proj = P.newProject({ name: 'Water Monitor', number: 'WM-1' }, 'ann');
  ok(proj.id.indexOf('pl') === 0 && proj.meta.phase === 'EVT' && proj.slug === 'water-monitor', 'new project has a pl id, the first phase and a slug');
  var top = node(proj, { kind: 'assembly', name: 'Top' });
  var a = node(proj, { parent: top.id, name: 'Main board', source: 'ee', ref: { tool: 'ee', id: 'p1' }, massG: 50 });
  var b = node(proj, { parent: top.id, name: 'Housing', source: 'me', ref: { tool: 'me', id: 'm1' }, massG: 400 });
  ok(a.order === 1 && b.order === 2, 'new nodes go after their siblings');

  var mine = JSON.parse(JSON.stringify(proj)), theirs = JSON.parse(JSON.stringify(proj));
  mine.nodes[a.id] = Object.assign({}, a, { name: 'Main board rev B', updatedAt: at('10:00:00') });
  theirs.nodes[b.id] = Object.assign({}, b, { deleted: true, updatedAt: at('10:00:01') });
  var c = Object.assign({}, a, { id: 'nNEW', name: 'Display', updatedAt: at('10:00:02') }); theirs.nodes.nNEW = c;
  var merged = P.merge(mine, theirs);
  ok(merged.nodes[a.id].name === 'Main board rev B' && merged.nodes[b.id].deleted && merged.nodes.nNEW, 'merge keeps both sides’ node edits, deletions and additions');
  var older = JSON.parse(JSON.stringify(mine)); older.nodes[a.id].name = 'Stale'; older.nodes[a.id].updatedAt = at('09:00:00');
  eq(P.merge(older, mine).nodes[a.id].name, 'Main board rev B', 'the newer node record wins');
  eq(Object.keys(merged).sort(), ['createdAt', 'createdBy', 'id', 'meta', 'nodes', 'reqs', 'schema', 'slug'], 'a merged document carries only PL fields');

  // ── Tree: order, orphans, cycles, moves ──
  var t = P.tree(proj);
  eq(t.roots, [top.id], 'one root');
  eq(t.children[top.id], [a.id, b.id], 'children in order');
  eq(t.depth[a.id], 1, 'depth');
  var orph = JSON.parse(JSON.stringify(proj)); orph.nodes[top.id].deleted = true;
  var to = P.tree(orph);
  ok(to.roots.length === 2 && to.flags[a.id] === 'orphan' && to.flags[b.id] === 'orphan', 'children of a deleted assembly move to the top, flagged');
  var cyc = JSON.parse(JSON.stringify(proj));
  var x = node(cyc, { kind: 'assembly', name: 'X' }), y = node(cyc, { kind: 'assembly', name: 'Y', parent: x.id });
  cyc.nodes[x.id].parent = y.id;   // two merged moves made X and Y each other's parent
  var tc = P.tree(cyc), cut = [x.id, y.id].sort()[0], other = cut === x.id ? y.id : x.id;
  ok(tc.flags[cut] === 'cycle' && tc.roots.indexOf(cut) >= 0 && tc.parent[other] === cut, 'a cycle is broken at its lowest id', JSON.stringify(tc));
  ok(P.flatten(tc).length === P.liveNodes(cyc).length, 'every live node appears once after breaking a cycle');
  var self = JSON.parse(JSON.stringify(proj)); self.nodes[a.id].parent = a.id;
  ok(P.tree(self).flags[a.id] === 'cycle', 'a node that is its own parent is flagged');
  ok(!P.canMove(t, top.id, a.id) && !P.canMove(t, top.id, top.id) && P.canMove(t, a.id, '') && P.canMove(t, b.id, top.id), 'a node can’t move under itself or its descendants');
  eq(P.path(t, a.id).map(function (n) { return n.name; }), ['Top'], 'path to a node');
  // The System map's trunk, and the one-Part product shown as one button
  ok(P.topAssembly(t) === top.id && P.topAssembly(to) === '', 'the top assembly is the one top-level assembly, else none');
  eq(P.soloPart(t), '', 'a product of two Parts has no solo Part');
  var one = JSON.parse(JSON.stringify(proj)); one.nodes[b.id].deleted = true;
  eq(P.soloPart(P.tree(one)), a.id, 'one Part inside the top assembly is the solo Part');
  var alone = JSON.parse(JSON.stringify(one)); alone.nodes[top.id].deleted = true;
  eq(P.soloPart(P.tree(alone)), a.id, 'one Part with no assembly is the solo Part');
  var nested = JSON.parse(JSON.stringify(one)), sub = node(nested, { kind: 'assembly', name: 'Sub', parent: top.id });
  nested.nodes[a.id].parent = sub.id;
  eq(P.soloPart(P.tree(nested)), '', 'one Part under a sub-assembly keeps the tree');

  // ── Part status and roll-up ──
  function summary(total, reviewed, open, stage, list) {
    return { v: 1, tool: 'ee', name: 'D', stage: stage || 'Layout', total: total, reviewed: reviewed, pct: Math.round(100 * reviewed / total),
      checklists: {}, issues: { open: open, fixed: 1, waived: 0 }, open: list, reqs: null, at: at('08:00:00'), by: 'bob' };
  }
  var index = { entries: {
    'ee:p1': { tool: 'ee', id: 'p1', name: 'Main', summary: summary(100, 50, { critical: 1, major: 0, minor: 2 }, 'Layout',
      [{ id: 'i1', severity: 'minor', text: 'm' }, { id: 'i2', severity: 'critical', text: 'c' }]) },
    'me:m1': { tool: 'me', id: 'm1', name: 'Housing', summary: summary(300, 0, { critical: 0, major: 1, minor: 0 }, 'Prototype (EVT)') }
  }, errors: [] };
  var r = P.rollup(proj, index);
  eq([r[''].total, r[''].reviewed, r[''].pct], [400, 50, 13], 'progress is reviewed over total checks across designs');
  eq(r[''].open, { critical: 1, major: 1, minor: 2 }, 'open issues add up by severity');
  eq(r[top.id].openTotal, 4, 'an assembly rolls up its Parts');
  eq(r[a.id].pct, 50, 'a Part shows its own design');
  eq(r[''].massG, 450, 'mass adds up over Parts that have one');
  eq(Object.keys(r[''].stages).sort(), ['ee:Layout', 'me:Prototype (EVT)'], 'stages are kept per tool, not mapped');

  var p2 = JSON.parse(JSON.stringify(proj));
  var twin = node(p2, { parent: top.id, name: 'Main board (second)', source: 'ee', ref: { tool: 'ee', id: 'p1' }, qty: 2, massG: 50 });
  var r2 = P.rollup(p2, index);
  ok(r2[''].total === 400 && r2[''].designs === 2 && r2[''].massG === 550, 'a design used twice counts once; mass uses quantity');
  var bought = node(p2, { parent: top.id, name: 'Battery', source: 'purchased' });
  var fw = node(p2, { parent: top.id, name: 'Firmware', source: 'fw' });
  var loose = node(p2, { parent: top.id, name: 'Unlinked board', source: 'ee' });
  var gone = node(p2, { parent: top.id, name: 'Moved away', source: 'ee', ref: { tool: 'ee', id: 'pGONE' } });
  var r3 = P.rollup(p2, index);
  ok(r3[''].purchased === 1 && r3[''].manual === 1 && r3[''].unlinked === 1 && r3[''].attention === 1 && r3[''].total === 400 && r3[''].massMissing === 4,
    'purchased, firmware, unlinked and missing Parts are counted but not in progress', JSON.stringify(r3['']));
  eq(P.partStatus(p2.nodes[gone.id], index).state, 'notfound', 'a link to a project no repo holds is not found');
  eq(P.partStatus(p2.nodes[gone.id], { entries: {}, errors: [{ tool: 'ee' }] }).state, 'error', 'a link whose tool failed to read is an error, not missing');
  var noSum = { entries: { 'ee:p1': { tool: 'ee', id: 'p1', name: 'Main', summary: null } }, errors: [] };
  eq(P.partStatus(proj.nodes[a.id], noSum).state, 'nosummary', 'a project file without a summary is “not summarized yet”');
  ok(P.rollup(proj, noSum)[''].total === 0 && P.rollup(proj, noSum)[''].attention === 2, '…and isn’t counted as 0% reviewed');

  var iss = P.issues(p2, index);
  eq(iss.map(function (i) { return i.id; }), ['i2', 'i1'], 'issues are listed worst first, a shared design once');
  ok(iss[0].node.id === a.id && iss[0].projectId === 'p1', 'each issue knows its Part and design');
  eq(P.unlistedIssues(proj, index), 1, 'issues from a summary without a list are counted as unlisted');

  // ── Reader ──
  var hub = new FakeHub();
  function file(id, name, sum) { var d = { id: id, meta: { name: name, board: 'B-' + id, revision: 'A', stage: 'Layout' }, items: {} }; if (sum) d.summary = sum; return M.stableStringify(d); }
  hub.makeRepo('own/ee_design_review_data', { 'projects/p1.json': file('p1', 'Main', summary(100, 50, { critical: 0, major: 0, minor: 0 })), 'users.json': '{}' }, ['own']);
  hub.makeRepo('own/review-ee-sensor', { 'projects/p2.json': file('p2', 'Sensor', null) }, ['own']);
  hub.makeRepo('own/review-me-housing', { 'projects/m1.json': file('m1', 'Housing', summary(300, 30, { critical: 0, major: 0, minor: 0 })) }, ['own']);
  hub.makeRepo('own/unrelated', { 'projects/z.json': file('z', 'Not a review', null) }, ['own']);
  var tools = Signoff.config.tools;
  var reader = new Signoff.PLReader({ owner: 'own', tools: tools, token: 'tok-own', fetch: hub.fetchFor('tok-own') });
  var ix = await reader.refresh(null);
  eq(Object.keys(ix.entries).sort(), ['ee:p1', 'ee:p2', 'me:m1'], 'reads the data repo and prefixed repos of each tool, nothing else');
  ok(ix.entries['ee:p2'].summary === null && ix.entries['ee:p2'].number === 'B-p2' && ix.entries['ee:p1'].repo === 'own/ee_design_review_data', 'keeps meta, the summary (or null) and the repo');
  eq(ix.errors, [], 'a tool without a data repo yet is not an error');
  ok(!JSON.stringify(ix).includes('"items"'), 'only meta and summary are kept');

  var before = hub.calls.length;
  var ix2 = await reader.refresh(ix);
  ok(!hub.calls.slice(before).some(function (c) { return /\/git\/blobs\//.test(c); }), 'unchanged files aren’t downloaded again');
  ok(Object.keys(ix2.entries).length === 3, '…and are still in the index');
  ok('project' in ix.entries['ee:p1'].summary, 'keeps the summary’s client project');
  var old = JSON.parse(JSON.stringify(ix));
  Object.keys(old.files).forEach(function (r) { Object.keys(old.files[r]).forEach(function (f) { var e = old.files[r][f].entry; if (e && e.summary) delete e.summary.project; }); });
  before = hub.calls.length;
  await reader.refresh(old);
  ok(hub.calls.slice(before).some(function (c) { return /\/git\/blobs\//.test(c); }), 'entries cached before the client project was kept are read again');

  // p1 is shared with a contractor: it moves out of the data repo into its own repo.
  hub.makeRepo('own/review-ee-main', { 'projects/p1.json': file('p1', 'Main', summary(100, 60, { critical: 0, major: 0, minor: 0 })) }, ['own']);
  var ix3 = await reader.refresh(ix2);
  ok(ix3.entries['ee:p1'].repo === 'own/review-ee-main' && ix3.entries['ee:p1'].summary.reviewed === 60, 'a project in both repos (move in progress) resolves to the shared copy');
  hub.push('own/ee_design_review_data', { 'users.json': '{}' });
  var ix4 = await reader.refresh(ix3);
  ok(ix4.entries['ee:p1'].repo === 'own/review-ee-main', 'after the move a Part still finds its design');
  eq(P.partStatus(proj.nodes[a.id], ix4).state, 'ok', '…and its status is ok');

  hub.repos['own/review-me-housing'].collaborators = [];   // token loses access
  var ix5 = await reader.refresh(ix4);
  ok(!ix5.entries['me:m1'] && ix5.errors.length === 0, 'a repo the token can no longer list drops out quietly');
  eq(P.partStatus(proj.nodes[b.id], ix5).state, 'notfound', '…and its Part shows as not found');
  hub.makeRepo('own/review-ee-broken', { 'projects/p9.json': '{ not json' }, ['own']);
  var ix6 = await reader.refresh(ix5);
  ok(ix6.errors.some(function (e) { return e.repo === 'own/review-ee-broken'; }) && ix6.entries['ee:p1'], 'an unreadable file is reported and the rest still load');

  // Board previews stored by Fabcheck next to a review (EE docs/fabcheck-link.md, "Board previews").
  var phub = new FakeHub();
  var pindex = { v: 1, tool: 'fabcheck', runId: 'r1', at: '2026-11-01T00:00:00Z', hero: 'top', images: [
    { key: 'top', file: 'top.webp', type: 'image/webp', w: 640, h: 320 }, { key: 'bottom', file: 'bottom.webp', type: 'image/webp', w: 640, h: 320 },
    { key: 'evil', file: '../x.webp', type: 'image/webp' }, { key: 'svg', file: 'a.svg', type: 'image/svg+xml' }, { key: 'gone', file: 'gone.png', type: 'image/png' }],
    board: { w: 80, h: '50.5', t: 1.2 } };
  phub.makeRepo('own/ee_design_review_data', { 'projects/p1.json': file('p1', 'Main', summary(100, 50, { critical: 0, major: 0, minor: 0 })),
    'fabcheck/p1/preview/index.json': JSON.stringify(pindex), 'fabcheck/p1/preview/top.webp': 'TOP', 'fabcheck/p1/preview/bottom.webp': 'BOTTOM',
    'fabcheck/p9/preview/index.json': JSON.stringify(pindex) }, ['own']);
  var preader = new Signoff.PLReader({ owner: 'own', tools: tools, token: 'tok-own', fetch: phub.fetchFor('tok-own') });
  var pix = await preader.refresh(null), pv = pix.entries['ee:p1'].preview;
  eq(pv && pv.images.map(function (i) { return i.key; }), ['top', 'bottom'], 'reads a design’s stored previews and drops bad file names, types and missing files');
  ok(pv.hero === 'top' && pv.repo === 'own/ee_design_review_data' && /^[0-9a-f]{40}$/.test(pv.images[0].sha), 'a preview keeps its hero, repo and blob shas');
  ok(!pix.entries['ee:p9'], 'a preview without its review adds nothing');
  var pblob = await preader.image(pv.repo, pv.images[1]);
  ok(pblob.type === 'image/webp' && await pblob.text() === 'BOTTOM', 'an image is fetched by its blob sha');
  var before2 = phub.calls.length;
  var pix2 = await preader.refresh(pix);
  ok(pix2.entries['ee:p1'].preview && !phub.calls.slice(before2).some(function (c) { return /\/git\/blobs\//.test(c); }), 'an unchanged preview index isn’t downloaded again');
  var kept = Signoff.plReader.cleanIndex(JSON.parse(JSON.stringify(pix2)));
  ok(kept.entries['ee:p1'].preview.images.length === 2, 'a stored index keeps its previews');
  eq([pv.board, kept.entries['ee:p1'].preview.board], [[80, 50.5, 1.2], [80, 50.5, 1.2]], 'the board size Fabcheck stores with its pictures is read and kept');
  var forged = Signoff.plReader.cleanIndex({ entries: { 'ee:x': { tool: 'ee', id: 'x', preview: { images: [{ key: 'top', src: 'https://evil.example/a.svg' }, { key: 'b', src: 'javascript:alert(1)' }] } } } });
  ok(!forged.entries['ee:x'].preview, 'a stored preview can only point at the demo pictures');
  eq(Signoff.plReader.designs(ix6, 'ee').map(function (d) { return d.id; }).sort(), ['p1', 'p2'], 'designs() lists one tool’s projects');

  // Review repos are contractor-writable: planted files and hostile summaries.
  var BAD = '"><img src=x onerror=alert(1)>';
  var badSum = { pct: BAD, total: BAD, issues: { open: { critical: BAD, major: 2 }, fixed: BAD }, open: [{ id: 'x', severity: BAD, text: 't' }], checklists: { a: { pct: 250, name: 'A' } }, name: { toString: 1 } };
  var cs = Signoff.plReader.cleanSummary(badSum);
  ok(cs.pct === 0 && cs.total === 0 && cs.issues.open.critical === 0 && cs.issues.open.major === 2 && cs.issues.fixed === 0 && cs.open[0].severity === 'minor' && cs.checklists.a.pct === 100 && cs.name === '',
    'a summary from a review file is rebuilt with numbers and known severities only', JSON.stringify(cs));
  var dirtyIx = { entries: { 'ee:p1': { tool: 'ee', id: 'p1', name: 'Main', summary: badSum } } };
  eq(Signoff.plReader.cleanIndex(dirtyIx).entries['ee:p1'].summary.pct, 0, 'an index stored in the browser is cleaned the same way');
  hub.makeRepo('own/review-ee-evil', { 'projects/p1.json': file('p1', 'Planted', summary(100, 99, { critical: 0, major: 0, minor: 0 })), 'projects/p7.json': file('p2', 'Renamed', null) }, ['own']);
  hub.push('own/ee_design_review_data', { 'users.json': JSON.stringify({ shared: { p1: { repo: 'own/review-ee-main' }, p2: { repo: 'own/review-ee-sensor' } } }) });
  var ix7 = await reader.refresh(ix6);
  ok(ix7.entries['ee:p1'].repo === 'own/review-ee-main' && ix7.entries['ee:p2'].repo === 'own/review-ee-sensor' && !JSON.stringify(ix7.entries).includes('evil'),
    'with a shared map, a repo counts only for its own projects, and a file only for the id in its name');

  // ── PL's own documents through the engine store ──
  hub.makeRepo('own/signoff_pl_data', { 'README.md': '#' }, ['own']);
  var plStore = function () { return new Signoff.GitHubStore({ owner: 'own', repo: 'signoff_pl_data', branch: 'main', dataPath: '', token: 'tok-own', merge: P.merge }, hub.fetchFor('tok-own')); };
  var one = {}; one[proj.id] = proj;
  var s1 = await plStore().sync(one, null, {}, {});
  var onGit = JSON.parse(hub.files('own/signoff_pl_data')['projects/' + proj.id + '.json']);
  ok(onGit.nodes[a.id] && !onGit.summary && !onGit.items, 'a PL project syncs through the engine store with PL’s merge');
  var remoteEdit = JSON.parse(JSON.stringify(onGit)); remoteEdit.nodes[b.id].name = 'Housing (remote)'; remoteEdit.nodes[b.id].updatedAt = at('12:00:00');
  var f = hub.files('own/signoff_pl_data'); f['projects/' + proj.id + '.json'] = M.stableStringify(remoteEdit); hub.push('own/signoff_pl_data', f);
  var localEdit = JSON.parse(JSON.stringify(s1.projects[proj.id])); localEdit.nodes[a.id].name = 'Main (local)'; localEdit.nodes[a.id].updatedAt = at('12:00:01');
  var one2 = {}; one2[proj.id] = localEdit;
  await plStore().sync(one2, null, s1.cache, {});
  var both = JSON.parse(hub.files('own/signoff_pl_data')['projects/' + proj.id + '.json']);
  ok(both.nodes[a.id].name === 'Main (local)' && both.nodes[b.id].name === 'Housing (remote)', 'two people’s edits to different nodes both survive a sync');

  // Attached models' files sit beside the projects; a sync leaves them alone and reads by sha work.
  var meshGz = await Signoff.model3d.gzip(new TextEncoder().encode('PLM1 test mesh'));
  var meshSha = await Signoff.github.gitBlobShaBytes(meshGz);
  await plStore().putFiles([{ path: 'models/' + proj.id + '/' + a.id + '/mesh.plm.gz', bytes: meshGz }], { message: 'PL models: 1 file' });
  var s3 = await plStore().sync(one2, null, {}, {});
  ok(Object.keys(s3.projects).join() === proj.id, 'model files in the data repo aren’t read as projects', Object.keys(s3.projects).join());
  var back = await plStore().blobBytes(meshSha);
  eq(Array.from(back).join(), Array.from(meshGz).join(), 'a stored model file reads back by its blob sha');

  // ── Access: PL is for FTEs ──
  var tagOwn = P.tokenTag('tok-own'), tagCon = P.tokenTag('tok-con');
  ok(/^[0-9a-f]{8}$/.test(tagOwn) && tagOwn === P.tokenTag('tok-own') && tagOwn !== tagCon, 'a token fingerprint is stable and differs between tokens');
  var plRepo = 'own/signoff_pl_data', fte = { login: 'own', tag: tagOwn, repo: plRepo, state: 'fte' };
  ok(P.canSee(fte, 'tok-own', plRepo), 'a token a sync confirmed as an FTE’s sees the projects');
  ok(!P.canSee(fte, 'tok-con', plRepo), 'after a token change (another login) nothing shows until a sync confirms it');
  ok(!P.canSee(fte, 'tok-own', 'con/my_own_repo'), '…nor after the data repo in Settings changes');
  ok(!P.canSee(fte, '', plRepo) && !P.canSee({ login: 'own', tag: tagOwn, repo: plRepo, state: '' }, 'tok-own', plRepo) && !P.canSee({ login: 'con', tag: tagCon, repo: plRepo, state: 'none' }, 'tok-con', plRepo),
    'signed out, not checked yet, or not an FTE: nothing shows');

  // This browser holds the synced project and one not pushed yet; then a contractor signs in.
  var unsynced = P.newProject({ name: 'Unsynced product' }, 'ann');
  var browser = {}; browser[proj.slug] = JSON.parse(JSON.stringify(both)); browser[unsynced.slug] = unsynced;
  var unsyncedEdits = {}; unsyncedEdits[unsynced.id] = M.now();
  var browserById = {}; browserById[proj.id] = browser[proj.slug]; browserById[unsynced.id] = unsynced;
  var conStore = new Signoff.GitHubStore({ owner: 'own', repo: 'signoff_pl_data', branch: 'main', dataPath: '', token: 'tok-con', merge: P.merge }, hub.fetchFor('tok-con'));
  var denied = await conStore.sync(browserById, null, s1.cache, {}).then(function () { return null; }, function (e) { return e; });
  ok(denied && denied.status === 404, 'a token that can’t open the PL data repo gets a 404 (a contractor isn’t an FTE)');
  var kept = P.lockOut(browser, unsyncedEdits);
  eq(Object.keys(kept), [unsynced.slug], 'locking drops the projects the repo holds and keeps unsynced ones');
  var keptById = {}; keptById[unsynced.id] = kept[unsynced.slug];
  var back = await plStore().sync(keptById, null, {}, {});
  ok(back.projects[proj.id] && back.projects[unsynced.id] && hub.files('own/signoff_pl_data')['projects/' + unsynced.id + '.json'] &&
    M.stableStringify(JSON.parse(hub.files('own/signoff_pl_data')['projects/' + proj.id + '.json'])) === M.stableStringify(both),
    'an FTE’s next sync pushes the kept project, brings the dropped one back and leaves it untouched');

  // ── Demo ──
  var demo = Signoff.plDemo.build();
  var dr = P.rollup(demo.project, demo.index);
  ok(P.liveNodes(demo.project).length === Signoff.config.demo.tree.length && dr[''].designs === 4 && dr[''].attention === 0 && dr[''].unlinked === 0 &&
    dr[''].purchased === 3 && dr[''].manual === 1, 'the demo product links four designs, three purchased Parts and firmware', JSON.stringify(dr['']));
  ok(Signoff.config.demo.tree.filter(function (r) { return r.link; }).every(function (r) { return Signoff.plDemo.snapshot.designs[r.link]; }), 'every demo link has a design in the snapshot');
  eq(dr[''].massG, 205.2, 'demo mass matches the 205 g in the ME enclosure’s mass requirement');
  ok(P.issues(demo.project, demo.index).length === 20, 'the demo lists every open issue from the four designs');
  var talk = [];
  Object.keys(demo.index.entries).forEach(function (k) { ((demo.index.entries[k].summary || {}).recent || []).forEach(function (c) { talk.push(c); }); });
  ok(talk.length > 0 && talk.every(function (c) { return c.author && c.text && c.at <= new Date().toISOString(); }), 'the demo designs bring their recent discussion, dated in the past');
  var dirty = Signoff.plReader.cleanSummary({ recent: [{ id: 'c1', item: 'x', author: { a: 1 }, text: 'hi', at: 5 }, 'junk', null] });
  ok(dirty.recent.length === 1 && dirty.recent[0].author === '' && dirty.recent[0].text === 'hi', 'summary.recent is cleaned (strings only)');
  ok(Object.keys(demo.index.entries).every(function (k) { var a = demo.index.entries[k].summary.at; return a && a <= new Date().toISOString(); }), 'demo edit times are in the past');

  // ── Requirements (plreqs.js) ──
  var R = Signoff.plReqs, rq = R.rollup(demo.project, demo.index);
  var bySysText = function (s) { return rq.sys.filter(function (x) { return x.rec.text.indexOf(s) === 0; })[0]; };
  ok(rq.sys.length === 10 && rq.sys.every(function (s) { return /^REQ-\d{3}$/.test(s.rec.ref) && s.rec.discipline === 'sys'; }), 'the demo has ten System requirements, all REQ- with discipline sys');
  eq(rq.counts, { fail: 0, risk: 2, gap: 1, open: 5, pass: 2, deprecated: 0 }, 'System roll-up: at risk from linked open issues, met when every child passes');
  var temp = bySysText('The thermostat shall measure');
  ok(temp.state === 'risk' && temp.kids.length === 2 && Object.keys(temp.cells).length === 2, 'a System requirement rolls up its children on each allocated Part');
  var iso = bySysText('Mains shall be separated');
  ok(iso.state === 'gap' && Object.keys(iso.cells).filter(function (k) { return iso.cells[k] === 'gap'; }).length === 1, 'a Part allocated with no derived requirement is a gap');
  ok(bySysText('The installed thermostat').state === 'pass' && bySysText('The thermostat shall run from').state === 'pass', 'mass and mains are met');
  eq(rq.untraced.map(function (it) { return it.design.id + ':' + it.req.ref; }).sort(), ['mdemo13:REQ-002', 'mdemo5:REQ-004', 'pdemo11:REQ-003', 'pdemo11:REQ-004', 'pdemo7:REQ-004'], 'requirements with no System parent are untraced');
  ok(rq.inbox.unallocated.length === 1 && rq.inbox.approval.length === 1 && rq.inbox.approval[0].req.ref === 'REQ-005', 'the inbox lists the unallocated System requirement and the reworded child');
  var esd = bySysText('Every user-accessible');
  ok(esd.kids.some(function (it) { return it.home.tool === 'pl' && it.req.discipline === 'fw'; }), 'firmware requirements are held in PL and count as children');
  // A claimed parent that isn't a System requirement of this project doesn't count.
  var forged = JSON.parse(JSON.stringify(demo.index));
  forged.entries['ee:pdemo11'].summary.reqList[2].parent = { tool: 'pl', project: 'pl-other', id: esd.rec.id, ref: 'REQ-002' };
  ok(R.rollup(demo.project, forged).untraced.some(function (it) { return it.req.id === 'q11-2'; }), 'a parent in another PL project is ignored');
  // Overlay: what PL wrote shows until the review's own sync catches up.
  var ov = { 'ee:pdemo11': { 'q11-2': { id: 'q11-2', status: 'approved', parent: { tool: 'pl', project: demo.project.id, id: temp.rec.id, ref: temp.rec.ref }, at: '2999-01-01T00:00:00Z' } } };
  ok(R.rollup(demo.project, R.withOverlay(demo.index, ov)).sys.filter(function (s) { return s.rec.id === temp.rec.id; })[0].kids.length === 3, 'a written parent link shows before the review syncs');
  eq(R.pruneOverlay(demo.index, { 'ee:pdemo11': { a: { at: '2000-01-01T00:00:00Z' }, b: { at: '2999-01-01T00:00:00Z' } } }), { 'ee:pdemo11': { b: { at: '2999-01-01T00:00:00Z' } } }, 'overlay entries the summary has caught up with are dropped');
  var mcsv = R.csv(demo.project, demo.index);
  ok(/^ID,Requirement,Type,Category,Source,Verification method,Status,Roll-up,/.test(mcsv) && mcsv.trim().split('\n').length === 11, 'the compliance matrix has one row per System requirement and a column per Part');
  ok(R.suggest({ req: { text: 'Display brightness shall be readable from 2 m', category: 'Display' } }, rq.sys) === null, 'no suggested parent without real overlap');
  var mergedReqs = P.merge({ id: 'x', meta: {}, nodes: {}, reqs: { a: { id: 'a', updatedAt: '1' } }, extra: 1 }, { id: 'x', meta: {}, nodes: {}, reqs: { b: { id: 'b', updatedAt: '1' } } });
  ok(mergedReqs.reqs.a && mergedReqs.reqs.b && mergedReqs.extra === 1, 'PL merges requirements record by record and keeps keys it doesn’t know');
  var rl = Signoff.plReader.cleanSummary({ reqList: [{ id: 'q1', state: '<b>', discipline: 'ee', parent: { tool: 'ee', id: 'x', project: 'y' } }, 'junk', { id: 'q2', parent: { tool: 'pl', id: 'p', project: 'pl1', evil: 1 } }] }).reqList;
  ok(rl.length === 2 && rl[0].state === 'open' && !rl[0].parent && rl[1].parent.project === 'pl1' && !('evil' in rl[1].parent), 'the reader rebuilds reqList from known fields');

  // ── Bill of materials ──
  var bi = P.bom(demo.project, demo.index, 'indented'), bf = P.bom(demo.project, demo.index, 'flat');
  eq([bi.totals.massG, bf.totals.massG], [dr[''].massG, dr[''].massG], 'BOM mass totals match the roll-up (205.2 g), indented and consolidated');
  eq(bi.rows.slice(0, 3).map(function (r) { return r.item; }), ['1', '1.1', '1.1.1'], 'indented BOM numbers items by the structure');
  ok(bi.rows.length === P.liveNodes(demo.project).length && bf.rows.every(function (r) { return r.kind === 'part'; }), 'indented lists every node; consolidated lists Parts only');
  eq(bi.totals.qty, 9, 'the demo BOM has 9 pieces (two screws)');
  var bp = JSON.parse(JSON.stringify(demo.project)), main = P.liveNodes(bp).filter(function (n) { return n.ref && n.ref.id === 'pdemo7'; })[0];
  node(bp, { parent: main.parent, name: 'Main PCBA (spare)', source: 'ee', ref: { tool: 'ee', id: 'pdemo7' }, qty: 2, massG: 48 });
  node(bp, { parent: main.parent, name: 'Cable A', source: 'purchased', massG: 1 });
  node(bp, { parent: main.parent, name: 'Cable A', source: 'purchased', massG: 1 });
  var bf2 = P.bom(bp, demo.index, 'flat'), mainLine = bf2.rows.filter(function (r) { return r.ref === 'ee:pdemo7'; });
  ok(mainLine.length === 1 && mainLine[0].extQty === 3 && mainLine[0].uses.length === 2 && mainLine[0].extMassG === 144, 'consolidated BOM sums the same design across Parts', JSON.stringify(mainLine));
  ok(bf2.rows.filter(function (r) { return r.name === 'Cable A'; }).length === 2, 'Parts with only a name in common stay on separate lines');
  var nested = P.newProject({ name: 'Kit' }, 'ann'), kit = node(nested, { kind: 'assembly', name: 'Kit', qty: 3 });
  node(nested, { parent: kit.id, name: 'Bolt', number: 'B-1', source: 'purchased', qty: 4, massG: 2 });
  eq(P.bom(nested, null, 'indented').rows[1].extQty, 12, 'an assembly’s quantity multiplies the Parts in it');

  // ── 3D models ──
  var M3 = Signoff.model3d, SHA1 = 'a'.repeat(40), SHA2 = 'b'.repeat(40);
  ok(P.cleanModel({ mesh: { sha: 'nope' } }) === null && P.cleanModel(null) === null, 'a model record without a valid mesh sha is ignored');
  var cm = P.cleanModel({ file: 'psu.step', mesh: { sha: SHA1, size: 10 }, step: { sha: 'bad' }, dir: 'models/p/n/', views: [{ key: 'iso', sha: SHA2 }, { key: 'evil', sha: SHA2 }, { key: 'top', sha: 'x' }] });
  ok(cm && cm.step === null && cm.views.length === 1 && cm.views[0].key === 'iso', 'model records keep only known views with valid shas', JSON.stringify(cm));
  var mp = P.newProject({ name: 'M' }, 'ann');
  node(mp, { name: 'PSU', source: 'purchased', model: { mesh: { sha: SHA1 }, step: { sha: SHA2 }, dir: 'models/x/y/', views: [] } });
  node(mp, { name: 'Gone', source: 'purchased', deleted: true, model: { mesh: { sha: 'c'.repeat(40) }, dir: 'models/x/z/' } });
  eq(P.modelFiles(mp), (function () { var o = {}; o[SHA1] = 'models/x/y/mesh.plm.gz'; o[SHA2] = 'models/x/y/source.step.gz'; return o; })(), 'files to upload are those of live Parts only');
  // A test mesh: a 140 × 140 grid bent into a dome, two triangles per cell.
  var G = 140, gp = [], gi = [], gc = [];
  for (var gy = 0; gy <= G; gy++) for (var gx = 0; gx <= G; gx++) gp.push(gx, gy, 20 * Math.sin(gx / G * Math.PI) * Math.sin(gy / G * Math.PI));
  for (gy = 0; gy < G; gy++) for (gx = 0; gx < G; gx++) { var g0 = gy * (G + 1) + gx; gi.push(g0, g0 + 1, g0 + G + 1, g0 + 1, g0 + G + 2, g0 + G + 1); gc.push(200, 50, 50, 50, 50, 200); }
  var gm = { pos: new Float32Array(gp), idx: new Uint32Array(gi), col: new Uint8Array(gc) };
  var small = M3.simplify(gm, 5000);
  ok(small.idx.length / 3 <= 5000 && small.idx.length / 3 > 1000, 'simplify keeps a mesh under its triangle cap', small.idx.length / 3 + ' triangles');
  eq(M3.simplify(gm, 1e9).idx.length, gm.idx.length, 'a mesh under the cap keeps every triangle');
  var dec = await M3.decode(await M3.encode(small)), err = 0;
  for (var di = 0; di < small.pos.length; di++) err = Math.max(err, Math.abs(dec.pos[di] - small.pos[di]));
  ok(dec.idx.length === small.idx.length && err <= 140 / 65535 && dec.col.join() === small.col.join() && dec.idx.join() === small.idx.join(), 'a mesh survives encode and decode (16-bit positions)', 'max error ' + err);
  var big = await M3.encode(gm), raw = gm.pos.byteLength + gm.idx.byteLength + gm.col.byteLength;
  ok(big.length < raw / 3, 'the stored mesh is much smaller than the raw mesh', big.length + ' bytes vs ' + raw);
  var text = new TextEncoder().encode('ISO-10303-21;\n' + 'DATA;\n#1=CARTESIAN_POINT(\'\',(0.,0.,0.));\n'.repeat(500));
  eq(Array.from(await M3.gzip(await M3.gzip(text), 'gunzip')).join(), Array.from(text).join(), 'a kept STEP gunzips to the bytes picked');
  var img = M3.render(small, { w: 64, h: 48, az: M3.VIEWS[0].az, el: M3.VIEWS[0].el }), lit = 0;
  for (var pi = 3; pi < img.data.length; pi += 4) if (img.data[pi]) lit++;
  ok(img.width === 64 && lit > 200 && img.data[3] === 0, 'render draws the part on a transparent background', lit + ' pixels');

  // ── Arranging in 3D ──
  var near = function (a, b) { return a.every(function (v, i) { return Math.abs(v - b[i]) < 1e-6; }); };
  ok(near(M3.alignMove({ type: 'point', p: [1, 2, 3] }, { type: 'point', p: [4, 6, 8] }), [3, 4, 5]), 'snap: corner to corner moves by the difference');
  ok(near(M3.alignMove({ type: 'plane', p: [5, 5, 2], n: [0, 0, -1] }, { type: 'plane', p: [0, 0, 10], n: [0, 0, 1] }), [0, 0, 8]), 'snap: face to face only closes the gap between the planes');
  ok(near(M3.alignMove({ type: 'line', p: [3, 4, 0], d: [0, 0, 1] }, { type: 'line', p: [10, 10, 50], d: [0, 0, -1] }), [7, 6, 0]), 'snap: hole axis to hole axis lines them up and keeps the height');
  ok(near(M3.alignMove({ type: 'line', p: [0, 0, 0], d: [1, 0, 0] }, { type: 'line', p: [5, 3, 2], d: [0, 1, 0] }), [0, 0, 2]), 'snap: crossing edges move along their common perpendicular until they meet');
  ok(near(M3.alignMove({ type: 'point', p: [1, 1, 1] }, { type: 'line', p: [0, 0, 0], d: [1, 0, 0] }), [0, -1, -1]), 'snap: a corner onto an edge takes the shortest way');
  ok(near(M3.alignMove({ type: 'point', p: [1, 1, 1] }, { type: 'plane', p: [0, 0, 5], n: [0, 0, 2] }), [0, 0, 4]), 'snap: a corner onto a face moves along the face normal');
  var sl = M3.slab(80, 50, 1.6), sf = M3.features(sl);
  ok(sf.corners.length >= 8 && Object.keys(sf.planes).length === 6 && sf.circles.length === 0, 'a board slab has corners and six flat faces', sf.corners.length + ' corners');
  ok(near(M3.bbox(sl.pos).size, [80, 50, 1.6]), 'a board slab has the board’s size');
  // A flat washer, 24 segments: its inner and outer edges are holes (circles) on one flat face.
  var wp = [], wi = [], N = 24;
  for (var wk = 0; wk < N; wk++) { var an = wk / N * 2 * Math.PI; wp.push(10 * Math.cos(an), 10 * Math.sin(an), 0, 4 * Math.cos(an), 4 * Math.sin(an), 0); }
  for (wk = 0; wk < N; wk++) { var o0 = wk * 2, o1 = ((wk + 1) % N) * 2; wi.push(o0, o1, o0 + 1, o1, o1 + 1, o0 + 1); }
  var washer = { pos: new Float32Array(wp), idx: new Uint32Array(wi), col: new Uint8Array(wi.length), fid: new Uint32Array(wi.length / 3) };
  var wf = M3.features(washer), radii = wf.circles.map(function (c) { return Math.round(c.r * 100) / 100; }).sort(function (a, b) { return a - b; });
  ok(radii.join() === '4,10', 'round edges are found as circles (washer ⌀8 and ⌀20)', radii.join());
  ok(Object.keys(wf.planes).length === 1 && wf.corners.length === 0, 'a faceted flat face is one face, and a round edge has no corners', Object.keys(wf.planes).length + ' faces, ' + wf.corners.length + ' corners');
  var wfaceted = Object.assign({}, washer, { fid: new Uint32Array(wi.length / 3).map(function (v, i) { return i; }) });
  ok(Object.keys(M3.features(wfaceted).planes).length === 1, 'a faceted STEP (a CAD face per facet) still gives one flat face');
  var dec2 = await M3.decode(await M3.encode(Object.assign({}, small, { fid: new Uint32Array(small.idx.length / 3).map(function (v, i) { return i % 7; }) })));
  ok(dec2.fid[13] === 6 && dec2.fid.length === small.idx.length / 3, 'CAD face ids survive encode and decode');
  ok(near(M3.place({ R: M3.rotation(0, 0, 90), pivot: [1, 0, 0], T: [0, 0, 5] }, [2, 0, 0]).map(function (v) { return Math.round(v * 1e9) / 1e9; }), [1, 1, 5]), 'a placed part turns about its pivot, then moves');
  eq(P.cleanPlace({ x: '3', y: 'bad', z: 1e9, rz: 90 }), { x: 3, y: 0, z: 100000, rx: 0, ry: 0, rz: 90 }, 'placements keep only numbers, within reason');
  ok(P.cleanPlace(null) === null && P.cleanBoard([0, 10]) === null && P.cleanBoard([80, 50]).join() === '80,50,1.6' && P.cleanBoard({ w: 30, h: 20, t: 0.8 }).join() === '30,20,0.8', 'board sizes need a width and height; thickness defaults to 1.6 mm');
  var sceneObjs = [{ mesh: sl, T: [0, 0, 0] }, { mesh: M3.slab(20, 20, 2), T: [0, 0, 10] }];
  var sr = M3.renderScene(sceneObjs, { az: 0, el: Math.PI / 2, zoom: 1, fit: 100, c: [0, 0, 0] }, 200, 200, { ss: 1 });
  var mid = sr.pick(100, 100), side = sr.pick(100 + 30 * 200 * 0.88 / 100, 100);
  ok(mid && mid.obj === 1 && side && side.obj === 0, 'seen from above, picking finds the part on top, and the board beside it');
  ok(near(sr.project([0, 0, 0]).slice(0, 2).map(Math.round), [100, 100]), 'project puts the view center in the middle of the canvas');

  // The snapshot must match what Signoff EE's and ME's demos build today (when they're served
  // next to this folder). Times differ by design, so they're left out.
  var live = await new Promise(function (resolve) {
    var f = document.createElement('iframe'); f.style.display = 'none'; f.src = '../tools/demo_designs.html?t=' + Date.now();
    document.body.appendChild(f);
    var tries = 0, t = setInterval(function () {
      var r = f.contentWindow && f.contentWindow.result;
      if (r || ++tries > 40) { clearInterval(t); f.remove(); resolve(r || null); }
    }, 250);
  });
  function strip(designs) {
    var out = {};
    Object.keys(designs).forEach(function (k) { var d = JSON.parse(JSON.stringify(designs[k])); delete d.summary.at; (d.summary.reqList || []).forEach(function (q) { delete q.at; }); (d.summary.recent || []).forEach(function (c) { delete c.at; }); out[k] = d; });
    return M.stableStringify(out);
  }
  if (live) {
    var liveData = JSON.parse(live.slice(live.indexOf('{'), live.lastIndexOf(';')));
    ok(strip(liveData.designs) === strip(Signoff.plDemo.snapshot.designs), 'demo-designs.js matches the EE and ME demos (regenerate it with tools/demo_designs.html if not)');
  } else {
    ok(true, 'skipped: EE and ME aren’t served next to this folder, so the demo snapshot wasn’t compared');
  }

  var failed = results.filter(function (r) { return !r.ok; });
  document.getElementById('out').innerHTML = results.map(function (r) {
    return '<div class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✓ ' : '✗ ') + r.name + '</div>' + (r.ok ? '' : '<pre>' + (r.detail || '') + '</pre>');
  }).join('');
  document.getElementById('summary').textContent = (failed.length ? 'FAIL: ' + failed.length + ' of ' : 'PASS: all ') + results.length + ' tests';
  document.title = failed.length ? 'FAIL' : 'PASS';
})().catch(function (e) {
  document.getElementById('summary').textContent = 'ERROR: ' + e.message;
  document.title = 'ERROR';
  console.error(e);
});
</script>
</body>
</html>
