<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signoff PL tests</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 32px; background: #f5f5f7; color: #1d1d1f; }
  .pass { color: #248a3d; } .fail { color: #d70015; font-weight: 600; }
  #summary { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  pre { margin: 2px 0 8px 18px; color: #515154; }
</style>
</head>
<body>
<div id="summary">Running…</div>
<div id="out"></div>
<script>
// Load fresh on every run, so a browser cache never tests old code.
['config', 'vendor/model', 'vendor/github', 'pl', 'plreqs', 'model3d', 'reader', 'share', 'access', 'demo-designs', 'demo'].forEach(function (n) { document.write('<script src="../assets/' + n + '.js?t=' + Date.now() + '"><\/script>'); });
document.write('<script src="fake-hub.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
/* Unit tests for the PL model and the summary reader, against a fake GitHub API.
   Open this file over http; the title shows PASS or FAIL. */
(async function () {
  var M = Signoff.model, P = Signoff.pl, results = [];
  function ok(cond, name, detail) { results.push({ ok: !!cond, name: name, detail: detail }); }
  function eq(a, b, name) { ok(JSON.stringify(a) === JSON.stringify(b), name, 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); }
  function at(s) { return '2099-01-01T' + s + 'Z'; }   // later than any node's creation stamp
  function node(p, f) { var n = P.newNode(p, f, 'ann'); p.nodes[n.id] = n; return n; }

  // ── Documents and merge ──
  var proj = P.newProject({ name: 'Water Monitor', number: 'WM-1' }, 'ann');
  ok(proj.id.indexOf('pl') === 0 && proj.meta.phase === 'EVT' && proj.slug === 'water-monitor', 'new project has a pl id, the first phase and a slug');
  var top = node(proj, { kind: 'assembly', name: 'Top' });
  var a = node(proj, { parent: top.id, name: 'Main board', source: 'ee', ref: { tool: 'ee', id: 'p1' }, massG: 50 });
  var b = node(proj, { parent: top.id, name: 'Housing', source: 'me', ref: { tool: 'me', id: 'm1' }, massG: 400 });
  ok(a.order === 1 && b.order === 2, 'new nodes go after their siblings');

  var mine = JSON.parse(JSON.stringify(proj)), theirs = JSON.parse(JSON.stringify(proj));
  mine.nodes[a.id] = Object.assign({}, a, { name: 'Main board rev B', updatedAt: at('10:00:00') });
  theirs.nodes[b.id] = Object.assign({}, b, { deleted: true, updatedAt: at('10:00:01') });
  var c = Object.assign({}, a, { id: 'nNEW', name: 'Display', updatedAt: at('10:00:02') }); theirs.nodes.nNEW = c;
  var merged = P.merge(mine, theirs);
  ok(merged.nodes[a.id].name === 'Main board rev B' && merged.nodes[b.id].deleted && merged.nodes.nNEW, 'merge keeps both sides’ node edits, deletions, and additions');
  var older = JSON.parse(JSON.stringify(mine)); older.nodes[a.id].name = 'Stale'; older.nodes[a.id].updatedAt = at('09:00:00');
  eq(P.merge(older, mine).nodes[a.id].name, 'Main board rev B', 'the newer node record wins');
  eq(Object.keys(merged).sort(), ['createdAt', 'createdBy', 'id', 'meta', 'nodes', 'reqs', 'schema', 'slug'], 'a merged document carries only PL fields');

  // ── Tree: order, orphans, cycles, moves ──
  var t = P.tree(proj);
  eq(t.roots, [top.id], 'one root');
  eq(t.children[top.id], [a.id, b.id], 'children in order');
  eq(t.depth[a.id], 1, 'depth');
  var orph = JSON.parse(JSON.stringify(proj)); orph.nodes[top.id].deleted = true;
  var to = P.tree(orph);
  ok(to.roots.length === 2 && to.flags[a.id] === 'orphan' && to.flags[b.id] === 'orphan', 'children of a deleted assembly move to the top, flagged');
  var cyc = JSON.parse(JSON.stringify(proj));
  var x = node(cyc, { kind: 'assembly', name: 'X' }), y = node(cyc, { kind: 'assembly', name: 'Y', parent: x.id });
  cyc.nodes[x.id].parent = y.id;   // two merged moves made X and Y each other's parent
  var tc = P.tree(cyc), cut = [x.id, y.id].sort()[0], other = cut === x.id ? y.id : x.id;
  ok(tc.flags[cut] === 'cycle' && tc.roots.indexOf(cut) >= 0 && tc.parent[other] === cut, 'a cycle is broken at its lowest id', JSON.stringify(tc));
  ok(P.flatten(tc).length === P.liveNodes(cyc).length, 'every live node appears once after breaking a cycle');
  var self = JSON.parse(JSON.stringify(proj)); self.nodes[a.id].parent = a.id;
  ok(P.tree(self).flags[a.id] === 'cycle', 'a node that is its own parent is flagged');
  ok(!P.canMove(t, top.id, a.id) && !P.canMove(t, top.id, top.id) && P.canMove(t, a.id, '') && P.canMove(t, b.id, top.id), 'a node can’t move under itself or its descendants');
  eq(P.path(t, a.id).map(function (n) { return n.name; }), ['Top'], 'path to a node');
  // The System map's trunk, and the one-Part product shown as one button
  ok(P.topAssembly(t) === top.id && P.topAssembly(to) === '', 'the top assembly is the one top-level assembly, else none');
  eq(P.soloPart(t), '', 'a product of two Parts has no solo Part');
  var one = JSON.parse(JSON.stringify(proj)); one.nodes[b.id].deleted = true;
  eq(P.soloPart(P.tree(one)), a.id, 'one Part inside the top assembly is the solo Part');
  var alone = JSON.parse(JSON.stringify(one)); alone.nodes[top.id].deleted = true;
  eq(P.soloPart(P.tree(alone)), a.id, 'one Part with no assembly is the solo Part');
  var nested = JSON.parse(JSON.stringify(one)), sub = node(nested, { kind: 'assembly', name: 'Sub', parent: top.id });
  nested.nodes[a.id].parent = sub.id;
  eq(P.soloPart(P.tree(nested)), '', 'one Part under a sub-assembly keeps the tree');

  // ── Part status and roll-up ──
  function summary(total, reviewed, open, stage, list) {
    return { v: 1, tool: 'ee', name: 'D', stage: stage || 'Layout', total: total, reviewed: reviewed, pct: Math.round(100 * reviewed / total),
      checklists: {}, issues: { open: open, fixed: 1, waived: 0 }, open: list, reqs: null, at: at('08:00:00'), by: 'bob' };
  }
  var index = { entries: {
    'ee:p1': { tool: 'ee', id: 'p1', name: 'Main', summary: summary(100, 50, { critical: 1, major: 0, minor: 2 }, 'Layout',
      [{ id: 'i1', severity: 'minor', text: 'm' }, { id: 'i2', severity: 'critical', text: 'c' }]) },
    'me:m1': { tool: 'me', id: 'm1', name: 'Housing', summary: summary(300, 0, { critical: 0, major: 1, minor: 0 }, 'Prototype (EVT)') }
  }, errors: [] };
  var r = P.rollup(proj, index);
  eq([r[''].total, r[''].reviewed, r[''].pct], [400, 50, 13], 'progress is reviewed over total checks across designs');
  eq(r[''].open, { critical: 1, major: 1, minor: 2 }, 'open issues add up by severity');
  eq(r[top.id].openTotal, 4, 'an assembly rolls up its Parts');
  eq(r[a.id].pct, 50, 'a Part shows its own design');
  eq(r[''].massG, 450, 'mass adds up over Parts that have one');
  eq(Object.keys(r[''].stages).sort(), ['ee:Layout', 'me:Prototype (EVT)'], 'stages are kept per tool, not mapped');

  var p2 = JSON.parse(JSON.stringify(proj));
  var twin = node(p2, { parent: top.id, name: 'Main board (second)', source: 'ee', ref: { tool: 'ee', id: 'p1' }, qty: 2, massG: 50 });
  var r2 = P.rollup(p2, index);
  ok(r2[''].total === 400 && r2[''].designs === 2 && r2[''].massG === 550, 'a design used twice counts once; mass uses quantity');
  var bought = node(p2, { parent: top.id, name: 'Battery', source: 'purchased' });
  // A source with no Signoff tool configured (firmware was one until Signoff FW).
  var appPart = node(p2, { parent: top.id, name: 'Mobile app', source: 'app' });
  var loose = node(p2, { parent: top.id, name: 'Unlinked board', source: 'ee' });
  var gone = node(p2, { parent: top.id, name: 'Moved away', source: 'ee', ref: { tool: 'ee', id: 'pGONE' } });
  var r3 = P.rollup(p2, index);
  ok(r3[''].purchased === 1 && r3[''].manual === 1 && r3[''].planned === 1 && r3[''].unlinked === 0 && r3[''].attention === 1 && r3[''].total === 400 && r3[''].massMissing === 4,
    'purchased, tool-less, waiting (a placeholder board), and missing Parts are counted but not in progress', JSON.stringify(r3['']));
  eq(P.partStatus(p2.nodes[gone.id], index).state, 'notfound', 'a link to a project no repo holds is not found');
  eq(P.partStatus(p2.nodes[gone.id], { entries: {}, errors: [{ tool: 'ee' }] }).state, 'error', 'a link whose tool failed to read is an error, not missing');
  var noSum = { entries: { 'ee:p1': { tool: 'ee', id: 'p1', name: 'Main', summary: null } }, errors: [] };
  eq(P.partStatus(proj.nodes[a.id], noSum).state, 'nosummary', 'a project file without a summary is “not summarized yet”');
  ok(P.rollup(proj, noSum)[''].total === 0 && P.rollup(proj, noSum)[''].attention === 2, '…and isn’t counted as 0% reviewed');

  var iss = P.issues(p2, index);
  eq(iss.map(function (i) { return i.id; }), ['i2', 'i1'], 'issues are listed worst first, a shared design once');
  ok(iss[0].node.id === a.id && iss[0].projectId === 'p1', 'each issue knows its Part and design');
  eq(P.unlistedIssues(proj, index), 1, 'issues from a summary without a list are counted as unlisted');

  // ── Reader ──
  var hub = new FakeHub();
  function file(id, name, sum) { var d = { id: id, meta: { name: name, board: 'B-' + id, revision: 'A', stage: 'Layout' }, items: {} }; if (sum) d.summary = sum; return M.stableStringify(d); }
  hub.makeRepo('own/ee_design_review_data', { 'projects/p1.json': file('p1', 'Main', summary(100, 50, { critical: 0, major: 0, minor: 0 })), 'users.json': '{}' }, ['own']);
  hub.makeRepo('own/review-ee-sensor', { 'projects/p2.json': file('p2', 'Sensor', null) }, ['own']);
  hub.makeRepo('own/review-me-housing', { 'projects/m1.json': file('m1', 'Housing', summary(300, 30, { critical: 0, major: 0, minor: 0 })) }, ['own']);
  hub.makeRepo('own/unrelated', { 'projects/z.json': file('z', 'Not a review', null) }, ['own']);
  var tools = Signoff.config.tools;
  var reader = new Signoff.PLReader({ owner: 'own', tools: tools, token: 'tok-own', fetch: hub.fetchFor('tok-own') });
  var ix = await reader.refresh(null);
  eq(Object.keys(ix.entries).sort(), ['ee:p1', 'ee:p2', 'me:m1'], 'reads the data repo and prefixed repos of each tool, nothing else');
  ok(ix.entries['ee:p2'].summary === null && ix.entries['ee:p2'].number === 'B-p2' && ix.entries['ee:p1'].repo === 'own/ee_design_review_data', 'keeps meta, the summary (or null) and the repo');
  eq(ix.errors, [], 'a tool without a data repo yet is not an error');
  ok(!JSON.stringify(ix).includes('"items"'), 'only meta and summary are kept');

  var before = hub.calls.length;
  var ix2 = await reader.refresh(ix);
  ok(!hub.calls.slice(before).some(function (c) { return /\/git\/blobs\//.test(c); }), 'unchanged files aren’t downloaded again');
  ok(Object.keys(ix2.entries).length === 3, '…and are still in the index');
  ok('project' in ix.entries['ee:p1'].summary, 'keeps the summary’s client project');
  var old = JSON.parse(JSON.stringify(ix));
  delete old.v;
  before = hub.calls.length;
  await reader.refresh(old);
  ok(hub.calls.slice(before).some(function (c) { return /\/git\/blobs\//.test(c); }), 'a cache from an older reader (no reqList) is read again once');
  ok(ix.v === Signoff.plReader.CACHE_V && Signoff.plReader.cleanIndex(ix).v === ix.v, 'the index carries its cache shape, also once stored');

  // p1 is shared with a contractor: it moves out of the data repo into its own repo.
  hub.makeRepo('own/review-ee-main', { 'projects/p1.json': file('p1', 'Main', summary(100, 60, { critical: 0, major: 0, minor: 0 })) }, ['own']);
  var ix3 = await reader.refresh(ix2);
  ok(ix3.entries['ee:p1'].repo === 'own/review-ee-main' && ix3.entries['ee:p1'].summary.reviewed === 60, 'a project in both repos (move in progress) resolves to the shared copy');
  hub.push('own/ee_design_review_data', { 'users.json': '{}' });
  var ix4 = await reader.refresh(ix3);
  ok(ix4.entries['ee:p1'].repo === 'own/review-ee-main', 'after the move a Part still finds its design');
  eq(P.partStatus(proj.nodes[a.id], ix4).state, 'ok', '…and its status is ok');

  hub.repos['own/review-me-housing'].collaborators = [];   // token loses access
  var ix5 = await reader.refresh(ix4);
  ok(!ix5.entries['me:m1'] && ix5.errors.length === 0, 'a repo the token can no longer list drops out quietly');
  eq(P.partStatus(proj.nodes[b.id], ix5).state, 'notfound', '…and its Part shows as not found');
  hub.makeRepo('own/review-ee-broken', { 'projects/p9.json': '{ not json' }, ['own']);
  var ix6 = await reader.refresh(ix5);
  ok(ix6.errors.some(function (e) { return e.repo === 'own/review-ee-broken'; }) && ix6.entries['ee:p1'], 'an unreadable file is reported and the rest still load');

  // ── Loom harnesses (loom/assets/store.js): Parts linked to a tool whose designs aren't reviews ──
  var lhub = new FakeHub();
  function harnessFile(id, name, number, identAt) {
    var meta = { name: name, number: number, revision: 'A', project: 'Water Monitor', deleted: false, updatedAt: '2026-11-07T10:00:00.000Z', updatedBy: 'ann' };
    return M.stableStringify({ schema: 1, id: id, meta: meta, harness: { id: id, title: name, wires: [] },
      summary: { v: 1, tool: 'loom', name: name, number: number, revision: 'A', project: 'Water Monitor', identAt: identAt, archived: false,
        total: 0, reviewed: 0, pct: 0, checklists: {}, issues: { open: { critical: 0, major: 0, minor: 0 }, fixed: 0, waived: 0 },
        harness: { ends: 3, splices: 1, wires: 7, cables: 1, sets: 2, wireMm: 2830, errors: 0, warnings: 2, boards: ['p1'] } } });
  }
  // Loom stores each harness's wiring diagram next to it (loom/assets/store.js storeDrawings).
  var ldraw = JSON.stringify({ v: 1, tool: 'loom', src: 'x', hero: 'diagram', images: [{ key: 'diagram', file: 'diagram.png', type: 'image/png', w: 1600, h: 685 }] });
  lhub.makeRepo('own/loom_data', { 'projects/h1.json': harnessFile('h1', 'Sensor harness', 'H-100', '2026-11-07T12:00:00.000Z'),
    'drawing/h1/preview/index.json': ldraw, 'drawing/h1/preview/diagram.png': 'PNG1', 'drawing/h2/preview/index.json': ldraw, 'drawing/h2/preview/diagram.png': 'OLD' }, ['own']);
  lhub.makeRepo('own/review-loom-nothing', { 'projects/h9.json': harnessFile('h9', 'Stray', 'X', '') }, ['own']);
  lhub.makeRepo('own/review-loom-shared', { 'projects/h2.json': harnessFile('h2', 'Shared harness', 'H-200', ''), 'drawing/h2/preview/index.json': ldraw, 'drawing/h2/preview/diagram.png': 'PNG2' }, ['own']);
  lhub.push('own/loom_data', Object.assign(lhub.files('own/loom_data'), { 'users.json': M.stableStringify({ schema: 1, users: {}, shared: { h2: { id: 'h2', repo: 'own/review-loom-shared', name: 'Shared harness' } } }) }));
  var lix = await new Signoff.PLReader({ owner: 'own', tools: tools, token: 'tok-own', fetch: lhub.fetchFor('tok-own') }).refresh(null);
  var le = lix.entries['loom:h1'];
  ok(le && le.number === 'H-100' && le.summary.harness.wires === 7 && le.summary.identAt === '2026-11-07T12:00:00.000Z', 'a Loom harness is read with its number (meta.number), contents and identAt');
  ok(lix.entries['loom:h2'] && lix.entries['loom:h2'].repo === 'own/review-loom-shared' && !lix.entries['loom:h9'], 'shared harness repos are read, and only for the harnesses Loom’s shared map puts there');
  eq(lix.errors, [], 'no errors reading harnesses');
  var lpv = le.preview, lpv2 = lix.entries['loom:h2'].preview;
  ok(lpv && lpv.hero === 'diagram' && lpv.repo === 'own/loom_data' && lpv.images.length === 1 && lpv.images[0].w === 1600 && !lpv.board, 'a harness’s stored drawing is its preview, with no board size');
  ok(lpv2 && lpv2.repo === 'own/review-loom-shared' && await (await new Signoff.PLReader({ owner: 'own', tools: tools, token: 'tok-own', fetch: lhub.fetchFor('tok-own') }).image(lpv2.repo, lpv2.images[0])).text() === 'PNG2',
    'a shared harness’s drawing comes from its own repo, not a copy left in loom_data');
  var hp = P.newProject({ name: 'Water Monitor' }, 'ann'), htop = node(hp, { kind: 'assembly', name: 'Top' });
  var hb = node(hp, { parent: htop.id, name: 'Main board', source: 'ee', ref: { tool: 'ee', id: 'p1' } });
  var hn = node(hp, { parent: htop.id, name: 'Old name', number: 'H-099', source: 'loom', ref: { tool: 'loom', id: 'h1' }, identAt: '2026-11-07T11:00:00.000Z' });
  var hix = { entries: { 'ee:p1': ix4.entries['ee:p1'], 'loom:h1': le }, errors: [] };
  var hr = P.rollup(hp, hix)[''];
  ok(hr.harnesses === 1 && hr.designs === 1 && hr.total === ix4.entries['ee:p1'].summary.total, 'a harness Part counts as a harness, not a design: progress is the board’s alone');
  ok(P.bom(hp, hix).rows.filter(function (r) { return r.id === hn.id; })[0].pct === null, 'the BOM shows no progress for a harness');
  eq(P.adoptHarnesses(hp, hix, 'ann'), [hn.id], 'a name edited in Loom since comes over');
  eq([hp.nodes[hn.id].name, hp.nodes[hn.id].number, hp.nodes[hn.id].identAt], ['Sensor harness', 'H-100', '2026-11-07T12:00:00.000Z'], '…with Loom’s stamp');
  eq(P.adoptHarnesses(hp, hix, 'ann'), [], '…once');
  hp.nodes[hn.id] = Object.assign({}, hp.nodes[hn.id], { name: 'Renamed in PL', identAt: '2026-11-07T13:00:00.000Z' });
  eq(P.adoptHarnesses(hp, hix, 'ann'), [], 'a newer PL edit is kept (Loom takes it at its next sync)');
  ok(hp.nodes[hn.id].name === 'Renamed in PL' && hp.nodes[hb.id].name === 'Main board', '…and review Parts are never renamed');

  // ── Parts waiting to be started in their tool (pl.js claimPlanned; Loom's From Signoff PL list) ──
  var wp = P.newProject({ name: 'Water Monitor' }, 'ann'), wtop = node(wp, { kind: 'assembly', name: 'Top' });
  var wn = node(wp, { parent: wtop.id, name: 'Pump harness', number: 'H-300', source: 'loom', ref: null, supplier: 'Cable Co', mpn: 'CC-12' });
  var wbuy = node(wp, { parent: wtop.id, name: 'Bought harness', source: 'purchased', ref: null });
  eq(P.partStatus(wn, null).state, 'planned', 'a Part to be made in a tool, with no link yet, is waiting (planned)');
  var wr = P.rollup(wp, { entries: {}, errors: [] })[''];
  ok(wr.planned === 1 && wr.unlinked === 0 && wr.attention === 0, '…counted as planned, not as needing attention');
  var wb = P.bom(wp, null).rows.filter(function (r) { return r.id === wn.id; })[0];
  ok(wb.supplier === '' && wb.mpn === '', 'a non-purchased Part keeps its old supplier and MPN hidden from the BOM');
  function startedFile(id, at, project, nodeId, archived) {
    return { tool: 'loom', id: id, name: 'Pump harness', number: 'H-300', archived: !!archived,
      summary: Signoff.plReader.cleanSummary({ tool: 'loom', name: 'Pump harness', number: 'H-300', at: '2026-11-08T12:00:00.000Z', identAt: '', archived: !!archived, plPart: { project: project, node: nodeId, at: at }, harness: { wires: 2, ends: 2 } }) };
  }
  ok(Signoff.plReader.cleanSummary({ plPart: { project: 'p', node: 7 } }).plPart === undefined && Signoff.plReader.cleanSummary({ plPart: { project: 'p', node: 'n' } }).plPart.node === 'n', 'the reader keeps a well-formed plPart only');
  var wix = { entries: {
    'loom:hb': startedFile('hb', '2026-11-08T10:05:00.000Z', wp.id, wn.id),
    'loom:ha': startedFile('ha', '2026-11-08T10:00:00.000Z', wp.id, wn.id),
    'loom:hx': startedFile('hx', '2026-11-08T09:00:00.000Z', wp.id, wn.id, true),
    'loom:hp': startedFile('hp', '2026-11-08T09:00:00.000Z', wp.id, wbuy.id),
    'loom:ho': startedFile('ho', '2026-11-08T09:00:00.000Z', 'pl-other', wn.id) }, errors: [] };
  ok(P.claimedElsewhere(wix.entries['loom:ha'].summary, [wp]) && !P.claimedElsewhere(wix.entries['loom:hp'].summary, [wp]), 'a design started from a waiting Part stays out of trays; one naming a Part that no longer waits for it doesn’t');
  eq(P.claimPlanned(wp, wix, 'ann'), [wn.id], 'the waiting Part links to the design started from it');
  eq(wp.nodes[wn.id].ref, { tool: 'loom', id: 'ha' }, '…the earliest started of two, skipping an archived one');
  ok(wp.nodes[wn.id].name === 'Pump harness' && wp.nodes[wn.id].mpn === 'CC-12' && wp.nodes[wn.id].updatedBy === 'ann', '…keeping its own fields');
  ok(!wp.nodes[wbuy.id].ref && P.partStatus(wp.nodes[wbuy.id], wix).state === 'purchased', 'a Part switched back to Purchased isn’t linked');
  eq(P.claimPlanned(wp, wix, 'ann'), [], '…and it links once');
  ok(!P.claimedElsewhere(wix.entries['loom:hb'].summary, [wp]), 'the other design now waits in the tray like any other');
  // A board started from a waiting Part in Signoff EE (which writes summary.tool as 'EE').
  var wee = node(wp, { parent: wtop.id, name: 'Sensor board', source: 'ee', ref: null });
  var eeSum = Signoff.plReader.cleanSummary({ tool: 'EE', name: 'Sensor board', plPart: { project: wp.id, node: wee.id, at: '2026-11-08T11:00:00.000Z' } });
  ok(P.claimedElsewhere(eeSum, [wp], 'ee'), 'an EE board started from a waiting Part stays out of trays');
  eq(P.claimPlanned(wp, { entries: { 'ee:pnew': { tool: 'ee', id: 'pnew', summary: eeSum } }, errors: [] }, 'ann'), [wee.id], '…and its Part links to it');

  // ── An assembly linked to a review of the whole assembly (Signoff ME summary.kind 'assembly') ──
  ok(Signoff.plReader.cleanSummary({ kind: 'assembly' }).kind === 'assembly' && !('kind' in Signoff.plReader.cleanSummary({ kind: 'part' })), 'the reader keeps summary.kind only as assembly');
  function meSum(name, total, reviewed, major, reqs) {
    return Signoff.plReader.cleanSummary({ tool: 'ME', name: name, project: 'Gizmo', stage: 'Detailed design', total: total, reviewed: reviewed, pct: Math.round(100 * reviewed / total),
      kind: name === 'Enclosure' ? 'assembly' : undefined, issues: { open: { major: major }, fixed: 0, waived: 0 },
      open: major ? [{ id: 'pd-1', severity: 'major', text: 'Wall too thin', checklist: 'Part design' }] : [],
      reqList: (reqs || []).map(function (r) { return { id: r, ref: 'REQ-001', text: 'Fits the bracket', status: 'approved', verify: 'open', state: 'open', discipline: 'me' }; }) });
  }
  var lap = P.newProject({ name: 'Gizmo' }, 'ann'), latop = node(lap, { kind: 'assembly', name: 'Gizmo' });

  var big = await M3.encode(gm), raw = gm.pos.byteLength + gm.idx.byteLength + gm.col.byteLength;
  ok(big.length < raw / 3, 'the stored mesh is much smaller than the raw mesh', big.length + ' bytes vs ' + raw);
  var text = new TextEncoder().encode('ISO-10303-21;\n' + 'DATA;\n#1=CARTESIAN_POINT(\'\',(0.,0.,0.));\n'.repeat(500));
  eq(Array.from(await M3.gzip(await M3.gzip(text), 'gunzip')).join(), Array.from(text).join(), 'a kept STEP gunzips to the bytes picked');
  var img = M3.render(small, { w: 64, h: 48, az: M3.VIEWS[0].az, el: M3.VIEWS[0].el }), lit = 0;
  for (var pi = 3; pi < img.data.length; pi += 4) if (img.data[pi]) lit++;
  ok(img.width === 64 && lit > 200 && img.data[3] === 0, 'render draws the part on a transparent background', lit + ' pixels');
  // Turning follows the pointer (2026-11-09): the point of the part nearest the eye moves with the drag.
  var iso = M3.VIEWS[0], eyeAt = function (az, el) { return M3.renderScene([], { az: az, el: el, fit: 100 }, 10, 10).cam.f.map(function (v) { return v * 50; }); };
  var nearPt = eyeAt(iso.az, iso.el), seen = function (st) { return M3.renderScene([], { az: st.az, el: st.el, fit: 100 }, 200, 200).project(nearPt); };
  var p0 = seen(iso), pRight = seen(M3.orbit(iso.az, iso.el, 20, 0)), pDown = seen(M3.orbit(iso.az, iso.el, 0, 20));
  ok(pRight[0] - p0[0] > 5 && Math.abs(pRight[1] - p0[1]) < (pRight[0] - p0[0]) / 4, 'dragging right turns the part’s near side right', JSON.stringify([p0, pRight]));
  ok(pDown[1] - p0[1] > 5 && Math.abs(pDown[0] - p0[0]) < (pDown[1] - p0[1]) / 4, 'dragging down turns the part’s near side down (its top comes toward you)', JSON.stringify([p0, pDown]));
  eq(M3.orbit(0, 1.5, 0, 500).el, Math.PI / 2, 'turning stops looking straight down');
  var bq = M3.budget(381, 239, false), bs = M3.budget(381, 239, true), bigQ = M3.budget(4600, 2500, false), bigS = M3.budget(4600, 2500, true);
  ok(bq.k === 1 && bq.ss === 1 && bs.k === 1 && bs.ss === 2, 'the inspector’s small view draws at full size, supersampled when still', JSON.stringify([bq, bs]));
  ok(Math.abs(4600 * 2500 * bigQ.k * bigQ.k - 1e6) < 1e3 && 4600 * 2500 * bigS.k * bigS.k * bigS.ss * bigS.ss <= 8e6 + 1e3, 'a big canvas draws within the pixel budget', JSON.stringify([bigQ, bigS]));
  var sb = M3.bbox(small.pos), sfit = Math.hypot(sb.size[0], sb.size[1], sb.size[2]), smid = [0, 1, 2].map(function (i) { return (sb.lo[i] + sb.hi[i]) / 2; });
  var litX = function (im) { var s = 0, n = 0; for (var q = 3; q < im.data.length; q += 4) if (im.data[q]) { s += ((q - 3) / 4) % im.width; n++; } return s / n; };
  var front = { w: 80, h: 60, az: 0, el: 0, fit: sfit, box: sb, ss: 1 };
  var centered = M3.render(small, front), panned = M3.render(small, Object.assign({}, front, { c: [smid[0] - 20, smid[1], smid[2]] }));
  ok(litX(panned) - litX(centered) > 5, 'a viewer’s center point pans the part (centered further left, the part shows further right)', litX(centered) + ' → ' + litX(panned));

  // ── Arranging in 3D ──
  var near = function (a, b) { return a.every(function (v, i) { return Math.abs(v - b[i]) < 1e-6; }); };
  ok(near(M3.alignMove({ type: 'point', p: [1, 2, 3] }, { type: 'point', p: [4, 6, 8] }), [3, 4, 5]), 'snap: corner to corner moves by the difference');
  ok(near(M3.alignMove({ type: 'plane', p: [5, 5, 2], n: [0, 0, -1] }, { type: 'plane', p: [0, 0, 10], n: [0, 0, 1] }), [0, 0, 8]), 'snap: face to face only closes the gap between the planes');
  ok(near(M3.alignMove({ type: 'line', p: [3, 4, 0], d: [0, 0, 1] }, { type: 'line', p: [10, 10, 50], d: [0, 0, -1] }), [7, 6, 0]), 'snap: hole axis to hole axis lines them up and keeps the height');
  ok(near(M3.alignMove({ type: 'line', p: [0, 0, 0], d: [1, 0, 0] }, { type: 'line', p: [5, 3, 2], d: [0, 1, 0] }), [0, 0, 2]), 'snap: crossing edges move along their common perpendicular until they meet');
  ok(near(M3.alignMove({ type: 'point', p: [1, 1, 1] }, { type: 'line', p: [0, 0, 0], d: [1, 0, 0] }), [0, -1, -1]), 'snap: a corner onto an edge takes the shortest way');
  ok(near(M3.alignMove({ type: 'point', p: [1, 1, 1] }, { type: 'plane', p: [0, 0, 5], n: [0, 0, 2] }), [0, 0, 4]), 'snap: a corner onto a face moves along the face normal');
  var sl = M3.slab(80, 50, 1.6), sf = M3.features(sl);
  ok(sf.corners.length >= 8 && Object.keys(sf.planes).length === 6 && sf.circles.length === 0, 'a board slab has corners and six flat faces', sf.corners.length + ' corners');
  ok(near(M3.bbox(sl.pos).size, [80, 50, 1.6]), 'a board slab has the board’s size');
  // A flat washer, 24 segments: its inner and outer edges are holes (circles) on one flat face.
  var wp = [], wi = [], N = 24;
  for (var wk = 0; wk < N; wk++) { var an = wk / N * 2 * Math.PI; wp.push(10 * Math.cos(an), 10 * Math.sin(an), 0, 4 * Math.cos(an), 4 * Math.sin(an), 0); }
  for (wk = 0; wk < N; wk++) { var o0 = wk * 2, o1 = ((wk + 1) % N) * 2; wi.push(o0, o1, o0 + 1, o1, o1 + 1, o0 + 1); }
  var washer = { pos: new Float32Array(wp), idx: new Uint32Array(wi), col: new Uint8Array(wi.length), fid: new Uint32Array(wi.length / 3) };
  var wf = M3.features(washer), radii = wf.circles.map(function (c) { return Math.round(c.r * 100) / 100; }).sort(function (a, b) { return a - b; });
  ok(radii.join() === '4,10', 'round edges are found as circles (washer ⌀8 and ⌀20)', radii.join());
  ok(Object.keys(wf.planes).length === 1 && wf.corners.length === 0, 'a faceted flat face is one face, and a round edge has no corners', Object.keys(wf.planes).length + ' faces, ' + wf.corners.length + ' corners');
  var wfaceted = Object.assign({}, washer, { fid: new Uint32Array(wi.length / 3).map(function (v, i) { return i; }) });
  ok(Object.keys(M3.features(wfaceted).planes).length === 1, 'a faceted STEP (a CAD face per facet) still gives one flat face');
  var dec2 = await M3.decode(await M3.encode(Object.assign({}, small, { fid: new Uint32Array(small.idx.length / 3).map(function (v, i) { return i % 7; }) })));
  ok(dec2.fid[13] === 6 && dec2.fid.length === small.idx.length / 3, 'CAD face ids survive encode and decode');
  ok(near(M3.place({ R: M3.rotation(0, 0, 90), pivot: [1, 0, 0], T: [0, 0, 5] }, [2, 0, 0]).map(function (v) { return Math.round(v * 1e9) / 1e9; }), [1, 1, 5]), 'a placed part turns about its pivot, then moves');
  eq(P.cleanPlace({ x: '3', y: 'bad', z: 1e9, rz: 90 }), { x: 3, y: 0, z: 100000, rx: 0, ry: 0, rz: 90 }, 'placements keep only numbers, within reason');
  ok(P.cleanPlace(null) === null && P.cleanBoard([0, 10]) === null && P.cleanBoard([80, 50]).join() === '80,50,1.6' && P.cleanBoard({ w: 30, h: 20, t: 0.8 }).join() === '30,20,0.8', 'board sizes need a width and height; thickness defaults to 1.6 mm');
  var sceneObjs = [{ mesh: sl, T: [0, 0, 0] }, { mesh: M3.slab(20, 20, 2), T: [0, 0, 10] }];
  var sr = M3.renderScene(sceneObjs, { az: 0, el: Math.PI / 2, zoom: 1, fit: 100, c: [0, 0, 0] }, 200, 200, { ss: 1 });
  var mid = sr.pick(100, 100), side = sr.pick(100 + 30 * 200 * 0.88 / 100, 100);
  ok(mid && mid.obj === 1 && side && side.obj === 0, 'seen from above, picking finds the part on top, and the board beside it');
  ok(near(sr.project([0, 0, 0]).slice(0, 2).map(Math.round), [100, 100]), 'project puts the view center in the middle of the canvas');

  // The snapshot must match what Signoff EE's, ME's, and FW's demos build today (when they're served
  // next to this folder). Times differ by design, so they're left out.
  var live = await new Promise(function (resolve) {
    var f = document.createElement('iframe'); f.style.display = 'none'; f.src = '../tools/demo_designs.html?t=' + Date.now();
    document.body.appendChild(f);
    var tries = 0, t = setInterval(function () {
      var r = f.contentWindow && f.contentWindow.result;
      if (r || ++tries > 40) { clearInterval(t); f.remove(); resolve(r || null); }
    }, 250);
  });
  function strip(designs) {
    var out = {};
    Object.keys(designs).forEach(function (k) { var d = JSON.parse(JSON.stringify(designs[k])); delete d.summary.at; (d.summary.reqList || []).forEach(function (q) { delete q.at; }); (d.summary.recent || []).forEach(function (c) { delete c.at; }); (d.summary.revisions || []).forEach(function (r) { delete r.sentAt; }); out[k] = d; });
    return M.stableStringify(out);
  }
  if (live) {
    var liveData = JSON.parse(live.slice(live.indexOf('{'), live.lastIndexOf(';')));
    ok(strip(liveData.designs) === strip(Signoff.plDemo.snapshot.designs), 'demo-designs.js matches the EE, ME, and FW demos (regenerate it with tools/demo_designs.html if not)');
  } else {
    ok(true, 'skipped: EE, ME, and FW aren’t served next to this folder, so the demo snapshot wasn’t compared');
  }

  var failed = results.filter(function (r) { return !r.ok; });
  document.getElementById('out').innerHTML = results.map(function (r) {
    return '<div class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✓ ' : '✗ ') + r.name + '</div>' + (r.ok ? '' : '<pre>' + (r.detail || '') + '</pre>');
  }).join('');
  document.getElementById('summary').textContent = (failed.length ? 'FAIL: ' + failed.length + ' of ' : 'PASS: all ') + results.length + ' tests';
  document.title = failed.length ? 'FAIL' : 'PASS';
})().catch(function (e) {
  document.getElementById('summary').textContent = 'ERROR: ' + e.message;
  document.title = 'ERROR';
  console.error(e);
});
</script>
</body>
</html>
